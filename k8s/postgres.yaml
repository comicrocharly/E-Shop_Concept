# =============================================================================
# PostgreSQL 16 — StatefulSet + PVC
# Stato persistente: il DB sopravvive a restart e ricreazione dei pod.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: eshop-db
  namespace: eshop
  labels:
    app.kubernetes.io/name: eshop-db
spec:
  selector:
    app.kubernetes.io/name: eshop-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eshop-db-data
  namespace: eshop
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: eshop-db
  namespace: eshop
  labels:
    app.kubernetes.io/name: eshop-db
spec:
  serviceName: eshop-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eshop-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eshop-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: eshop-secret
                  key: db-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eshop-secret
                  key: db-password
            - name: POSTGRES_DB
              value: "eshop"
          # Self-healing: se postgres crasha, K8s lo riavvia (dati sul PVC)
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "eshop", "-d", "eshop"]
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "eshop", "-d", "eshop"]
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: eshop-db-data
