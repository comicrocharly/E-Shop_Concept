# =============================================================================
# nginx — punto d'ingresso unico, accesso parallelo
# Esposto via NodePort 30080 → mappato su host 8080 dal cluster kind
# (vedi kind/cluster.yaml): http://localhost:8080
# nginx smista a Service eshop-api, che bilancia le richieste sulle repliche.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: eshop
  labels:
    app.kubernetes.io/name: nginx
data:
  nginx.conf: |
    worker_processes auto;
    error_log /dev/stderr warn;
    events {
      worker_connections 1024;
    }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      sendfile on;
      keepalive_timeout 65;
      client_max_body_size 50m;

      upstream eshop {
        # Service K8s: il DNS ritorna l'IP cluster e il kernel bilancia
        # le connessioni sui pod ready. max_fails dà self-healing a livello
        # di upstream (se il service è down, nginx lo segnala subito).
        server eshop-api.eshop.svc.cluster.local:8081
               max_fails=3 fail_timeout=10s;
      }

      server {
        listen 80;
        server_name _;

        location / {
          proxy_pass http://eshop;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_connect_timeout 5s;
          proxy_read_timeout 60s;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: eshop
  labels:
    app.kubernetes.io/name: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: nginx
                topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: eshop
  labels:
    app.kubernetes.io/name: nginx
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
