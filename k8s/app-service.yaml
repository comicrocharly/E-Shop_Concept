# =============================================================================
# Service interno: endpoint stabile + load balancing sulle 3 repliche.
# nginx (vedi nginx.yaml) puntano qui; il balancing effettivo verso i pod
# lo fa la rete K8s (iptables/ipvs) — ogni replica è raggiunta in parallelo.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: eshop-api
  namespace: eshop
  labels:
    app.kubernetes.io/name: eshop
spec:
  selector:
    app.kubernetes.io/name: eshop
  ports:
    - port: 8081
      targetPort: 8081
