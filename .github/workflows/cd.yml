# =============================================================================
# CD — Deploy sul cluster dev (main only)
# Gira su self-hosted runner "cachyos-x8664" su questa macchina: solo da qui
# si vede il cluster kind e il docker locale.
#
# Pre-requisimo (una tantum, vedi README-K8S.md):
#   - secret GITHUB_TOKEN / runner registrato sulla repo
#   - kubectl configurato (kind) e cluster `eshop` accceso
# =============================================================================
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-eshop-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy dev
    runs-on: [self-hosted, cachyos-x8664]
    steps:
      - uses: actions/checkout@v4

      # 0) Cluster presente (altrimenti lo crea)
      - name: Ensure kind cluster
        run: |
          if ! docker ps --format '{{.Names}}' | grep -q '^eshop-control-plane$'; then
            make cluster
            make deps
          fi

      # 1) Build locale tagata col commit (nessun registry: kind load)
      - name: Build images
        run: |
          docker build -t eshop-api:${{ github.sha }} .
          docker build -f frontend/Dockerfile -t eshop-web:${{ github.sha }} frontend/

      - name: Load images into kind
        run: |
          kind load docker-image eshop-api:${{ github.sha }} --name eshop
          kind load docker-image eshop-web:${{ github.sha }} --name eshop

      # 2) Deploy: immagini tagate → rollout + health gate (backend prima, poi frontend)
      - name: Deploy
        run: |
          kubectl -n eshop set image deployment/eshop eshop=eshop-api:${{ github.sha }}
          kubectl -n eshop rollout status deployment/eshop --timeout=180s
          kubectl -n eshop set image deployment/frontend frontend=eshop-web:${{ github.sha }}
          kubectl -n eshop rollout status deployment/frontend --timeout=120s

      # 3) Smoke test: l'ingresso frontend deve rispondere
      - name: Smoke test
        # (ingresso frontend deve rispondere prima di lanciare gli E2E)
        # NB: il shell di default è bash -e → la chiamata curl non può
        # fallire in modo "nudo" (abortirebbe lo script e il retry loop),
        # da qui il `|| true` e il --max-time.
        run: |
          code=""
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:8080/ || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          [ "$code" = "200" ] || { echo "❌ smoke test fallito (http $code)"; exit 1; }

      # 4) E2E (Playwright, S5): flow reali contro il cluster via l'ingresso
      #    frontend (nginx :8080, /api → backend). Disattivati by design in
      #    `mvn test`; qui li riattiviamo col flag. Credenziali admin:
      #    default CREDENTIALS.md, override via vars/secrets della repo.
      - name: E2E Playwright
        run: |
          if ! ls "${HOME}/.cache/ms-playwright" 2>/dev/null | grep -q '^chromium'; then
            npx -y playwright@1.55.0 install chromium
          fi
          mvn -B test \
            -Dtest='PlaywrightSmokeTest,ShopFlowTest' \
            -De2e.enabled=true \
            -De2e.baseUrl=http://localhost:8080 \
            -De2e.adminUsername="admin" \
            -De2e.adminPassword="${{ secrets.E2E_ADMIN_PASSWORD || 'admin123' }}"

      # 5) Rollback automatico se rollout/smoke/E2E non sono sani (doppia
      #    sicurezza: il rollout status sopra fallisce già, qui copriamo
      #    smoke test ed E2E)
      - name: Rollback on failure
        if: failure()
        run: |
          kubectl -n eshop rollout undo deployment/frontend || true
          kubectl -n eshop rollout undo deployment/eshop || true
