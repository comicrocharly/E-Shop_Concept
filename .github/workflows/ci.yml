# =============================================================================
# CI — Quality gate (ogni PR e ogni push su main)
#   1. test:  build + test suite (Testcontainers porta un PostgreSQL reale)
#   2. image: build dell'immagine; su main la pubblica su GHCR tagata col SHA
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Test suite (Testcontainers → PostgreSQL)
        run: mvn -B verify

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          # tag GHCR (pacchetto minuscolo: i reference Docker non ammettono maiuscole)
          docker build -t eshop-api:${{ github.sha }} -t ghcr.io/comicrocharly/e-shop_api:latest \
            --label com.eshop.sha=${{ github.sha }} .
          docker build -f frontend/Dockerfile \
            -t eshop-web:${{ github.sha }} -t ghcr.io/comicrocharly/e-shop_web:latest frontend/

      # Su main: pubblica le immagini su GHCR (docker push classico, niente buildx)
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.ref == 'refs/heads/main'
        name: Push images to GHCR
        run: |
          docker push ghcr.io/comicrocharly/e-shop_api:latest
          docker push ghcr.io/comicrocharly/e-shop_web:latest
