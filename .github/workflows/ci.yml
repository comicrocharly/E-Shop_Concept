# =============================================================================
# CI — Quality gate (ogni PR e ogni push su main)
#   1. test:  build + test suite (Testcontainers porta un PostgreSQL reale)
#   2. image: build dell'immagine; su main la pubblica su GHCR tagata col SHA
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Test suite (Testcontainers → PostgreSQL)
        run: mvn -B verify

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t eshop:${{ github.sha }} --label com.eshop.sha=${{ github.sha }} .

      # Su main: pubblica l'immagine su GHCR (tag = commit SHA → rollout/rollback riproducibili)
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          labels: com.eshop.sha=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
