# =============================================================================
# CI — Quality gate (ogni PR e ogni push su main)
#   1. lint:  Checkstyle (backend) + ESLint (frontend) — fail su violazione
#   2. test:  build + test suite completa (Testcontainers porta un PostgreSQL 16 reale)
#   3. image: build dell'immagine; su main la pubblica su GHCR tagata col SHA
#
#   Tutto su runner GitHub-hosted (ubuntu-latest): zero dipendenze locali.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint (Checkstyle + ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Checkstyle (backend)
        run: mvn -B checkstyle:check

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: ESLint (frontend)
        working-directory: frontend
        run: npm ci && npm run lint

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Test suite (Testcontainers → PostgreSQL 16)
        run: mvn -B verify

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          # tag GHCR (pacchetto minuscolo: i reference Docker non ammettono maiuscole)
          docker build -t eshop-api:${{ github.sha }} -t ghcr.io/comicrocharly/e-shop_api:latest \
            --label com.eshop.sha=${{ github.sha }} .
          docker build -f frontend/Dockerfile \
            -t eshop-web:${{ github.sha }} -t ghcr.io/comicrocharly/e-shop_web:latest \
            --label com.eshop.sha=${{ github.sha }} frontend/

      # Su main: pubblica le immagini su GHCR (docker push classico, niente buildx)
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.ref == 'refs/heads/main'
        name: Push images to GHCR
        run: |
          docker push ghcr.io/comicrocharly/e-shop_api:latest
          docker push ghcr.io/comicrocharly/e-shop_web:latest
