# =============================================================================
# E-shop Application Configuration
# =============================================================================

# Server
server.port=8081

# Use AntPathMatcher instead of PathPatternParser (Spring Boot 3.4+ default)
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

# =============================================================================
# DEFAULT PROFILE - PostgreSQL permanent database (Docker container)
# Use -Dspring.profiles.active=test for Testcontainers PostgreSQL
# =============================================================================

# Database - PostgreSQL (Docker: eshop-postgres)
spring.datasource.url=jdbc:postgresql://localhost:5432/eshop
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=eshop
spring.datasource.password=eshop123

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Multipart / immagini articoli
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.article-image-dir=data/article-images

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.access-token-expiration=3600000
app.jwt.refresh-token-expiration=86400000
