# =============================================================================
# Test Profile Configuration
# PostgreSQL via Testcontainers JDBC URL: container auto-started per JVM
# (reused across all test classes in the same JVM), schema dropped at end.
# =============================================================================

# Database - Testcontainers
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.url=jdbc:tc:postgresql:16:///eshop
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Rate limiting: limits are read from login-path.limit / register-path.limit
# (see RateLimitFilter#getLimitForPath). Raise them very high so no test ever
# hits a 429, and shrink the window so state resets fast.
app.rate-limit.login-path.limit=10000
app.rate-limit.register-path.limit=10000
app.rate-limit.default-limit=10000
app.rate-limit.window-seconds=1

# ?testUserId: abilitato SOLO per i test (nel profilo main è sempre disabilitato)
app.security.allow-test-userid=true
