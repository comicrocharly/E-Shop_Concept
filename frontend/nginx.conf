worker_processes auto;
error_log /dev/stderr warn;
events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    upstream eshop_api {
        # Service K8s: il DNS ritorna l'IP cluster e il kernel bilancia
        # le connessioni sui pod ready. max_fails dà self-healing a
        # livello di upstream (se il service è down, nginx lo segnala).
        server eshop-api.eshop.svc.cluster.local:8081
               max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # API: tutto /api/* va al backend (stesso origin → niente CORS)
        location /api/ {
            proxy_pass http://eshop_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # Immagini articoli: servite dal backend (Spring, /images/articles/**)
        # ATTENZIONE: Tomcat rifiuta il header Host con underscore → esplicito!
        location /images/ {
            proxy_pass http://eshop_api;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }

        # Frontend statico: file sul filesystem del container,
        # fallback a index.html (SPA)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
